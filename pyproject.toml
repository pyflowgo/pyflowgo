[project]
name = "pyflowgo"
version = "1.1.3"
description = "Compute the thermo-rheological properties down a lava channel"
authors = [
  { name = "Oryalava", email = "oryaelle.chevrel@ird.fr" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.7.0",
  "scipy>=0.12.0",
  "matplotlib>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/pyflowgo/pyflowgo"
